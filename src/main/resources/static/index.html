<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Reyestri — İT Təhlükəsizliyi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>XRİTDX Risk Reyestri</h1>
            <p>İnformasiya Təhlükəsizliyi İdarəetmə Paneli</p>
        </div>
        <ul class="sidebar-nav" id="sidebarNav"></ul>
    </aside>

    <main class="main-content">
        <div class="panel-card">
            <div class="panel-header">
                <h2 id="panelTitle">Cədvəl seçin</h2>
                <button type="button" class="btn btn-primary" id="btnAdd" disabled>
                    Yeni Məlumat Əlavə Et
                </button>
            </div>
            <div id="alertContainer"></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="empty-state d-none" id="emptyState">Bu cədvəldə hələ məlumat yoxdur.</div>
        </div>
    </main>
</div>

<div class="modal fade" id="entityModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Məlumat</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bağla"></button>
            </div>
            <form id="entityForm" style="display:contents;">
                <div class="modal-body" id="modalFormFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Ləğv et</button>
                    <button type="submit" class="btn btn-primary" id="btnSave">Yadda saxla</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Yüklənir...</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
