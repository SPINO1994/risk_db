spring.application.name=risk-registry-app

# ── Database (set these as environment variables in Render & CleverCloud) ─────────
# CleverCloud provides: MYSQL_ADDON_URI or individual vars below
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Server ────────────────────────────────────────────────────────────────────────
# Render injects PORT; fall back to 8080 for Docker
server.port=${PORT:8080}
